<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>📊 HYNM项目管理在线甘特图</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Microsoft YaHei','Segoe UI',sans-serif; background:#f5f7fa; color:#333; min-height:100vh; }
  .header { background:linear-gradient(135deg,#1a73e8 0%,#0d47a1 100%); color:#fff; padding:20px 30px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  .header h1 { font-size:24px; font-weight:600; }
  .header .info { font-size:14px; opacity:.9; }
  .header .actions { display:flex; gap:10px; align-items:center; }

  .btn-primary:hover { background:#e8f0fe; }
  .btn-success { background:#34a853; color:#fff; }
  .btn-success:hover { background:#2d8f47; }

  .toolbar input:focus,.toolbar select:focus { outline:none; border-color:#1a73e8; }
  .main-container { display:flex; height:calc(100vh - 130px); }
  .sidebar { width:320px; min-width:320px; background:#fff; border-right:1px solid #e0e0e0; overflow-y:auto; padding:15px; }
  .sidebar h3 { font-size:15px; margin-bottom:12px; color:#1a73e8; display:flex; justify-content:space-between; align-items:center; }
  .task-form { background:#f9fafb; padding:15px; border-radius:8px; margin-bottom:15px; border:1px solid #e8eaed; }
  .task-form .form-group { margin-bottom:10px; }
  .task-form label { display:block; font-size:12px; color:#666; margin-bottom:3px; font-weight:500; }
  .task-form input,.task-form select { width:100%; padding:6px 8px; border:1px solid #ddd; border-radius:4px; font-size:13px; }
  .task-form .form-row { display:flex; gap:8px; }

  .task-item.selected { border-color:#1a73e8; background:#e8f0fe; }
  .task-item .task-name { font-size:13px; font-weight:600; margin-bottom:4px; }
  .task-item .task-meta { font-size:11px; color:#888; display:flex; gap:8px; }
  .task-item .task-progress-bar { height:4px; background:#e8eaed; border-radius:2px; margin-top:6px; overflow:hidden; }

  .task-item:hover .delete-btn { display:block; }
  .gantt-area { flex:1; overflow:auto; background:#fff; padding:20px; }
  .gantt-header-row { display:flex; margin-bottom:5px; }
  .gantt-task-label-header { width:150px; min-width:150px; font-size:12px; color:#666; font-weight:600; padding:5px; border-bottom:2px solid #e0e0e0; }
  .gantt-timeline-header { display:flex; border-bottom:2px solid #e0e0e0; }
  .gantt-day-header { width:28px; min-width:28px; text-align:center; font-size:10px; color:#888; padding:5px 0; border-right:1px solid #f0f0f0; }

<script>
// ============================================================
//  密码与加密模块（AES-256-CBC）
//  密钥派生：key = SHA256(password)，iv = MD5(password) 取前16字节
//  仓库文件统一格式：标准 base64 密文 cipherB64（纯 ASCII）
// ============================================================
const ACCESS_PASSWORD = 'HYNM2026';
const DATA_FILENAME   = 'gantt-data.enc.json';

function getKeyAndIv(password) {
  if (!window.CryptoJS) throw new Error('CryptoJS 未加载，请检查网络后刷新');
  const key = CryptoJS.SHA256(password);
  const iv  = CryptoJS.MD5(password);          // 16 字节，正好作 CBC 的 IV
  return { key, iv };
}

// 明文对象 → 标准 base64 密文（cipherB64，纯 ASCII）
function encryptData(plainObj, password) {
  const { key, iv } = getKeyAndIv(password);
  const json = JSON.stringify(plainObj);
  const encrypted = CryptoJS.AES.encrypt(json, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
  return encrypted.toString(); // 标准 base64
}

// 标准 base64 密文 → 明文对象；失败抛异常
function decryptData(cipherB64, password) {
  const { key, iv } = getKeyAndIv(password);
  const decrypted = CryptoJS.AES.decrypt(cipherB64, key, { iv: iv, mode: CryptoJS.mode.CBC, padding: CryptoJS.pad.Pkcs7 });
  const json = decrypted.toString(CryptoJS.enc.Utf8);
  if (!json) throw new Error('解密结果为空（密码错误或数据损坏）');
  return JSON.parse(json);
}

// ============================================================
//  日期工具（UTC ordinal，与时区无关）
// ============================================================
function dateStrToOrd(dateStr){const[y,m,d]=dateStr.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000);}
function ordToDateStr(ord){const d=new Date(ord*86400000);const y=d.getUTCFullYear();const m=String(d.getUTCMonth()+1).padStart(2,'0');const day=String(d.getUTCDate()).padStart(2,'0');return `${y}-${m}-${day}`;}
function daysBetween(a,b){return dateStrToOrd(b)-dateStrToOrd(a);}
function addDaysToStr(s,n){return ordToDateStr(dateStrToOrd(s)+n);}
function getDayOfWeek(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay();}
function getDaysInMonth(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
function formatDateCN(s){const[y,m,d]=s.split('-').map(Number);return `${y}年${m}月${d}日`;}
function isValidDateStr(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const[y,m,d]=s.split('-').map(Number);if(m<1||m>12)return false;if(d<1||d>getDaysInMonth(y,m))return false;return ordToDateStr(dateStrToOrd(s))===s;}
function getTodayStr(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;}

// ============================================================
//  全局状态
// ============================================================
let ganttData = null;
let selectedTaskId = null;
let editingTaskId = null;
const todayStr = getTodayStr();
const todayOrd = dateStrToOrd(todayStr);

// ============================================================
//  密码验证流程
// ============================================================
function bindPasswordUI() {
  const input = document.getElementById('pwdInput');
  const btn   = document.getElementById('pwdBtn');
  const errEl = document.getElementById('pwdErr');
  const trySubmit = () => {
    errEl.textContent = '';
    const pw = input.value;
    if (!pw) { errEl.textContent = '请输入密码'; return; }
    if (pw !== ACCESS_PASSWORD) { errEl.textContent = '密码错误，请重试'; input.value=''; input.focus(); return; }
    // 密码正确 → 尝试加载加密数据
    loadEncryptedData().then(()=>{
      document.getElementById('pwdOverlay').style.display = 'none';
      document.getElementById('cfg_path').value = (JSON.parse(localStorage.getItem('github_config')||'{}').path) || DATA_FILENAME;
      renderAll();
    }).catch(err=>{
      errEl.textContent = err.message || '加载数据失败';
    });
  };
  btn.addEventListener('click', trySubmit);
  input.addEventListener('keydown', e=>{ if(e.key==='Enter') trySubmit(); });
}

// 加载并解密 gantt-data.enc.json
async function loadEncryptedData() {
  const url = DATA_FILENAME + '?t=' + Date.now(); // 防 CDN/浏览器缓存
  const res = await fetch(url, { cache:'no-store' });
  if (!res.ok) throw new Error('无法加载数据文件（' + res.status + '）');
  const text = (await res.text()).trim();
  if (!text) throw new Error('数据文件为空');
  // 兼容两种来源：纯 cipherB64（Python 生成）或被 btoa 再包一层的文件
  let cipherB64 = text;
  try {
    // 若整体能被 base64 解码且解码后是合法 base64（ASCII 范围内），视为被 btoa 包装
    const decoded = atob(text);
    if (/^[A-Za-z0-9+/=\s]+$/.test(decoded) && decoded.length > 0) {
      cipherB64 = decoded.trim();
    }
  } catch(e){ /* 不是 btoa 包装，按纯 cipherB64 处理 */ }
  const data = decryptData(cipherB64, ACCESS_PASSWORD);
  if (!data || !Array.isArray(data.tasks)) throw new Error('解密后的数据格式不正确');
  ganttData = data;
}

function renderAll(){renderProjectInfo();renderStats();renderPhaseFilter();renderTaskList();renderGantt();renderLastUpdated();}

function renderProjectInfo(){const p=ganttData.project;document.getElementById('projectInfo').textContent=`${p.name} | 负责人：${p.manager} | ${p.startDate} ~ ${p.endDate}`;}
function renderStats(){const t=ganttData.tasks;const total=t.length;const done=t.filter(x=>x.progress>=100).length;const ing=t.filter(x=>x.progress>0&&x.progress<100).length;const avg=total>0?Math.round(t.reduce((s,x)=>s+x.progress,0)/total):0;document.getElementById('statTotal').textContent=total;document.getElementById('statDone').textContent=done;document.getElementById('statProgress').textContent=ing;document.getElementById('statPercent').textContent=avg+'%';}
function renderPhaseFilter(){const sel=document.getElementById('phaseFilter');const cur=sel.value;const phases=[...new Set(ganttData.tasks.map(x=>x.phase))];sel.innerHTML='<option value="">全部阶段</option>'+phases.map(p=>`<option value="${p}">${p}</option>`).join('');sel.value=cur;}
function renderTaskList(){const c=document.getElementById('taskList');const search=document.getElementById('searchInput').value.toLowerCase();const phase=document.getElementById('phaseFilter').value;const tasks=ganttData.tasks.filter(t=>!search||t.name.toLowerCase().includes(search)).filter(t=>!phase||t.phase===phase);c.innerHTML=tasks.map(t=>{const e=addDaysToStr(t.start,t.duration-1);return `<div class="task-item ${selectedTaskId===t.id?'selected':''}" onclick="selectTask(${t.id})" ondblclick="openEdit(${t.id})"><button class="delete-btn" onclick="event.stopPropagation();deleteTask(${t.id})">✕</button><div class="task-name">${t.name}</div><div class="task-meta"><span>${t.phase}</span><span>👤 ${t.owner}</span><span>📅 ${t.start} ~ ${e}</span></div><div class="task-progress-bar"><div class="task-progress-fill" style="width:${t.progress}%;background:${t.color};"></div></div></div>`;}).join('');}
function renderLastUpdated(){const u=document.getElementById('lastUpdated');if(ganttData&&ganttData.project&&ganttData.project.updatedAt)u.textContent='最后更新：'+ganttData.project.updatedAt;else u.textContent='';}

// ============================================================
//  甘特图渲染（按天 / 按周 / 按月）
// ============================================================
function renderGantt(){
  const area=document.getElementById('ganttArea');
  if(!ganttData||!ganttData.tasks.length){area.innerHTML='<p style="color:#999;">暂无任务数据</p>';return;}
  const view=document.getElementById('viewMode').value;
  const tasks=ganttData.tasks;
  const minOrd=Math.min(...tasks.map(t=>dateStrToOrd(t.start)));
  const maxOrd=Math.max(...tasks.map(t=>dateStrToOrd(t.start)+t.duration-1));
  const padStart=minOrd-2, padEnd=maxOrd+4;
  const phaseOrder=[...new Set(tasks.map(t=>t.phase))];
  const phases={};tasks.forEach(t=>{(phases[t.phase]=phases[t.phase]||[]).push(t);});

  if(view==='day') renderDayView(area,phaseOrder,phases,padStart,padEnd);
  else if(view==='week') renderWeekView(area,phaseOrder,phases,padStart,padEnd);
  else renderMonthView(area,phaseOrder,phases,padStart,padEnd);
}

function renderDayView(area,phaseOrder,phases,rs,re){
  const dw=28; const totalDays=re-rs+1;
  let html='<div class="gantt-header-row"><div class="gantt-task-label-header">任务</div><div class="gantt-timeline-header" style="width:'+totalDays*dw+'px;">';
  for(let o=rs;o<=re;o++){const ds=ordToDateStr(o);const dow=getDayOfWeek(ds);const isWeekend=dow===0||dow===6;const isToday=ds===todayStr;html+='<div class="gantt-day-header'+(isWeekend?' weekend':'')+(isToday?' today':'')+'" style="width:'+dw+'px;"><div class="day-num">'+(ds.slice(8))+'</div><div class="day-name">'+(['日','一','二','三','四','五','六'][dow])+'</div></div>';}
  html+='</div></div><div class="gantt-body" style="width:'+(150+totalDays*dw)+'px;">';
  phaseOrder.forEach(ph=>{html+='<div class="phase-separator" style="margin-left:150px;">'+ph+'</div>';phases[ph].forEach(t=>{const to=dateStrToOrd(t.start);const left=(to-rs)*dw;const w=t.duration*dw-4;html+='<div class="gantt-row"><div class="gantt-task-label"><span class="label-name">'+t.name+'</span><span class="label-owner">'+t.owner+' · '+t.duration+'天 · '+t.progress+'%</span></div><div class="gantt-bar-area"><div class="gantt-bar-wrapper" style="left:'+left+'px;width:'+w+'px;background:'+t.color+';" ondblclick="openEdit('+t.id+')"><div class="gantt-bar-label">'+t.name+'</div><div class="gantt-bar-progress" style="width:'+t.progress+'%;background:'+t.color+';opacity:.75;"></div></div></div></div>';});});
  if(rs<=todayOrd&&todayOrd<=re) html+='<div class="gantt-today-line" style="left:'+(150+(todayOrd-rs)*dw+2)+'px;"></div>';
  html+='</div>';area.innerHTML=html;
}

function renderWeekView(area,phaseOrder,phases,rs,re){
  const dw=28; const totalDays=re-rs+1;
  let html='<div class="gantt-header-row"><div class="gantt-task-label-header">任务</div><div class="gantt-timeline-header" style="width:'+totalDays*dw+'px;">';
  for(let o=rs;o<=re;o++){const ds=ordToDateStr(o);const dow=getDayOfWeek(ds);if(dow===1||o===rs){const weekStart=o;let weekEnd=o+6;while(weekEnd<=re&&getDayOfWeek(ordToDateStr(weekEnd))!==0)weekEnd++;weekEnd=Math.min(weekEnd,re);const span=weekEnd-weekStart+1;html+='<div class="gantt-day-header" style="width:'+span*dw+'px;"><div class="day-num" style="font-size:10px;">'+ds.slice(5)+'~'+ordToDateStr(weekEnd).slice(5)+'</div></div>';o=weekEnd;}}
  html+='</div></div><div class="gantt-body" style="width:'+(150+totalDays*dw)+'px;">';
  phaseOrder.forEach(ph=>{html+='<div class="phase-separator" style="margin-left:150px;">'+ph+'</div>';phases[ph].forEach(t=>{const to=dateStrToOrd(t.start);const left=(to-rs)*dw;const w=t.duration*dw-4;html+='<div class="gantt-row"><div class="gantt-task-label"><span class="label-name">'+t.name+'</span><span class="label-owner">'+t.owner+' · '+t.duration+'天 · '+t.progress+'%</span></div><div class="gantt-bar-area"><div class="gantt-bar-wrapper" style="left:'+left+'px;width:'+w+'px;background:'+t.color+';" ondblclick="openEdit('+t.id+')"><div class="gantt-bar-label">'+t.name+'</div><div class="gantt-bar-progress" style="width:'+t.progress+'%;background:'+t.color+';opacity:.75;"></div></div></div></div>';});});
  if(rs<=todayOrd&&todayOrd<=re) html+='<div class="gantt-today-line" style="left:'+(150+(todayOrd-rs)*dw+2)+'px;"></div>';
  html+='</div>';area.innerHTML=html;
}

function renderMonthView(area,phaseOrder,phases,rs,re){
  const mw=80; const startY=ordToDateStr(rs).slice(0,4); const endY=ordToDateStr(re).slice(0,4);
  const years=[];for(let y=+startY;y<=+endY;y++)years.push(y);
  let html='<div class="gantt-header-row"><div class="gantt-task-label-header">任务</div><div style="display:flex;flex-direction:column;">';
  html+='<div class="gantt-timeline-header" style="height:auto;">';years.forEach(y=>{let months=0;for(let m=1;m<=12;m++){const first=dateStrToOrd(y+'-'+String(m).padStart(2,'0')+'-01');if(first>=rs&&first<=re)months++;}if(months>0)html+='<div class="gantt-year-header" style="width:'+months*mw+'px;">'+y+'</div>';});html+='</div><div class="gantt-timeline-header">';
  years.forEach(y=>{for(let m=1;m<=12;m++){const first=dateStrToOrd(y+'-'+String(m).padStart(2,'0')+'-01');if(first>=rs&&first<=re)html+='<div class="gantt-month-header" style="width:'+mw+'px;">'+y+'-'+String(m).padStart(2,'0')+'</div>';}});html+='</div></div></div>';
  const totalMonths=years.reduce((s,y)=>s+Math.min(12,Math.max(0,Math.min(12,Math.floor((re-firstOrdInYear(y,rs))/30)+1))),0);
  // 简化：按月跨度用天数近似定位
  html+='<div class="gantt-body" style="width:'+(150+totalMonths*mw)+'px;">';
  phaseOrder.forEach(ph=>{html+='<div class="phase-separator" style="margin-left:150px;">'+ph+'</div>';phases[ph].forEach(t=>{const to=dateStrToOrd(t.start);const monthsFromStart=monthDiff(rs,to);const durMonths=Math.max(1,Math.ceil(t.duration/30));const left=monthsFromStart*mw;const w=durMonths*mw-4;html+='<div class="gantt-row"><div class="gantt-task-label"><span class="label-name">'+t.name+'</span><span class="label-owner">'+t.owner+' · '+t.duration+'天 · '+t.progress+'%</span></div><div class="gantt-bar-area"><div class="gantt-bar-wrapper" style="left:'+left+'px;width:'+w+'px;background:'+t.color+';" ondblclick="openEdit('+t.id+')"><div class="gantt-bar-label">'+t.name+' ('+t.start+')</div><div class="gantt-bar-progress" style="width:'+t.progress+'%;background:'+t.color+';opacity:.75;"></div></div></div></div>';});});
  html+='</div>';area.innerHTML=html;
}
function firstOrdInYear(y,rs){const f=dateStrToOrd(y+'-01-01');return Math.max(f,rs);}
function monthDiff(ordFrom,ordTo){const d1=new Date(ordFrom*86400000);const d2=new Date(ordTo*86400000);return (d2.getUTCFullYear()-d1.getUTCFullYear())*12+(d2.getUTCMonth()-d1.getUTCMonth());}

// ============================================================
//  任务操作
// ============================================================
function selectTask(id){selectedTaskId=id;renderTaskList();}
function addTask(){
  const name=document.getElementById('f_name').value.trim();const startVal=document.getElementById('f_start').value;const duration=parseInt(document.getElementById('f_duration').value)||1;
  if(!name||!startVal){alert('请填写任务名称和开始日期');return;}
  if(!isValidDateStr(startVal)){alert('请选择有效的开始日期（YYYY-MM-DD）');return;}
  const startOrd=dateStrToOrd(startVal);if(ordToDateStr(startOrd)!==startVal){alert('日期解析异常');return;}
  const newId=ganttData.tasks.length?Math.max(...ganttData.tasks.map(t=>t.id))+1:1;
  const nt={id:newId,phase:document.getElementById('f_phase').value||'未分类',name,owner:document.getElementById('f_owner').value||'未分配',start:startVal,duration,progress:parseInt(document.getElementById('f_progress').value)||0,color:document.getElementById('f_color').value||'#4CAF50'};
  ganttData.tasks.push(nt);
  document.getElementById('f_name').value='';document.getElementById('f_progress').value='0';document.getElementById('f_progress_val').textContent='0';document.getElementById('f_start').value=todayStr;
  document.getElementById('debugAdd').textContent=`✓ 已添加: ${nt.start} ~ ${addDaysToStr(nt.start,nt.duration-1)} (${nt.duration}天)`;
  renderAll();showStatus('githubStatus',`✅ 任务「${name}」已添加`,'success');setTimeout(()=>showStatus('githubStatus',''),4000);
}
function deleteTask(id){if(!confirm('确定删除这个任务吗？'))return;ganttData.tasks=ganttData.tasks.filter(t=>t.id!==id);renderAll();}
function openEdit(id){const t=ganttData.tasks.find(x=>x.id===id);if(!t)return;editingTaskId=id;document.getElementById('e_name').value=t.name;document.getElementById('e_phase').value=t.phase;document.getElementById('e_owner').value=t.owner;document.getElementById('e_start').value=t.start;document.getElementById('e_duration').value=t.duration;document.getElementById('e_progress').value=t.progress;document.getElementById('e_progress_val').textContent=t.progress;document.getElementById('e_color').value=t.color;document.getElementById('editModal').classList.add('active');}
function closeModal(){document.getElementById('editModal').classList.remove('active');editingTaskId=null;}
function saveEdit(){const t=ganttData.tasks.find(x=>x.id===editingTaskId);if(!t)return;const ns=document.getElementById('e_start').value;if(!isValidDateStr(ns)){alert('日期格式无效');return;}t.name=document.getElementById('e_name').value;t.phase=document.getElementById('e_phase').value;t.owner=document.getElementById('e_owner').value;t.start=ns;t.duration=parseInt(document.getElementById('e_duration').value)||1;t.progress=parseInt(document.getElementById('e_progress').value)||0;t.color=document.getElementById('e_color').value;showStatus('githubStatus',`✅ 已更新：${t.start} ~ ${addDaysToStr(t.start,t.duration-1)}`,'success');setTimeout(()=>showStatus('githubStatus',''),3000);closeModal();renderAll();}

// ============================================================
//  GitHub 配置 & 保存（写入 gantt-data.enc.json，AES 加密）
// ============================================================
function showConfig(){document.getElementById('configModal').classList.add('active');}
function closeConfig(){document.getElementById('configModal').classList.remove('active');}
function saveConfig(){const cfg={owner:document.getElementById('cfg_owner').value.trim(),repo:document.getElementById('cfg_repo').value.trim(),branch:document.getElementById('cfg_branch').value.trim()||'main',token:document.getElementById('cfg_token').value.trim(),path:document.getElementById('cfg_path').value.trim()||DATA_FILENAME};localStorage.setItem('github_config',JSON.stringify(cfg));closeConfig();showStatus('githubStatus','✅ GitHub 配置已保存','success');setTimeout(()=>showStatus('githubStatus',''),3000);}

async function saveToGitHub(){
  const saved=localStorage.getItem('github_config');
  if(!saved){showStatus('githubStatus','⚠️ 请先配置 GitHub 信息','error');showConfig();return;}
  const cfg=JSON.parse(saved);
  if(!cfg.token||!cfg.owner||!cfg.repo){showStatus('githubStatus','⚠️ GitHub 配置不完整','error');return;}
  showStatus('githubStatus','⏳ 正在保存到 GitHub...','info');
  try{
    const apiUrl=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const getRes=await fetch(apiUrl+'?ref='+cfg.branch,{headers:{'Authorization':'token '+cfg.token}});
    let sha=null;if(getRes.ok)sha=(await getRes.json()).sha;
    // 明文 → AES 加密 → 标准 base64 密文；GitHub Contents API 要求 content 为文件字节的 base64
    const cipherB64=encryptData(ganttData,ACCESS_PASSWORD);
    const encoded=btoa(cipherB64);
    const putRes=await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'token '+cfg.token,'Content-Type':'application/json'},body:JSON.stringify({message:'更新甘特图数据 - '+new Date().toLocaleString('zh-CN'),content:encoded,branch:cfg.branch,sha:sha})});
    if(!putRes.ok)throw new Error((await putRes.json()).message||'保存失败');
    try{ganttData.project.updatedAt=new Date().toISOString();}catch(e){}
    showStatus('githubStatus','✅ 已成功保存到 GitHub！','success');renderLastUpdated();
  }catch(e){showStatus('githubStatus','❌ 保存失败：'+e.message,'error');}
}

// ============================================================
//  导入/导出（导出为明文 JSON，便于本地备份）
// ============================================================
function exportJSON(){const d=JSON.stringify(ganttData,null,2);const b=new Blob([d],{type:'application/json'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download='gantt-data.json';a.click();URL.revokeObjectURL(u);}
function importJSON(){document.getElementById('fileInput').click();}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{ganttData=JSON.parse(ev.target.result);renderAll();showStatus('githubStatus','✅ 数据导入成功','success');setTimeout(()=>showStatus('githubStatus',''),3000);}catch(err){showStatus('githubStatus','❌ 文件格式错误','error');}};r.readAsText(f);e.target.value='';}

// ============================================================
//  工具
// ============================================================
function showStatus(elementId,msg,type){const el=document.getElementById(elementId);if(!msg){el.innerHTML='';return;}el.innerHTML=`<div class="status-msg ${type}">${msg}</div>`;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeConfig();}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveToGitHub();}});

// ============================================================
init();
