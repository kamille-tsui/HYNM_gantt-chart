<!DOCTYPE html>

<head>

<!-- CryptoJS：AES 解密/加密（与 Python evpkdf+"Salted__" 格式兼容） -->
<script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Microsoft YaHei','Segoe UI',sans-serif; background:#f5f7fa; color:#333; min-height:100vh; }

<script>
// ============================================================
//  日期系统 —— 基于 Ordinal（序天数），消除时区问题
// ============================================================
function dateStrToOrd(dateStr){const[y,m,d]=dateStr.split('-').map(Number);return Math.floor(Date.UTC(y,m-1,d)/86400000);}
function ordToDateStr(ord){const D=new Date(ord*86400000);return `${D.getUTCFullYear()}-${String(D.getUTCMonth()+1).padStart(2,'0')}-${String(D.getUTCDate()).padStart(2,'0')}`;}
function daysBetween(a,b){return dateStrToOrd(b)-dateStrToOrd(a);}
function addDaysToStr(s,n){return ordToDateStr(dateStrToOrd(s)+n);}
function getDayOfWeek(s){const[y,m,d]=s.split('-').map(Number);return new Date(Date.UTC(y,m-1,d)).getUTCDay();}
function getDaysInMonth(y,m){return new Date(Date.UTC(y,m,0)).getUTCDate();}
function isValidDateStr(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const[y,m,d]=s.split('-').map(Number);if(m<1||m>12)return false;if(d<1||d>getDaysInMonth(y,m))return false;return ordToDateStr(dateStrToOrd(s))===s;}
function getTodayStr(){const n=new Date();return `${n.getFullYear()}-${String(n.getMonth()+1).padStart(2,'0')}-${String(n.getDate()).padStart(2,'0')}`;}

// ============================================================
//  密码 / 加解密
// ============================================================
const ACCESS_PASSWORD = "HYNM2026";
const ENC_FILENAME    = "gantt-data.enc.json"; // 仓库中存放的加密数据文件

// 解密：base64密文 -> 明文对象。密文格式为 CryptoJS 默认："Salted__" + 8字节salt + CBC密文
function decryptData(b64Cipher){
  try{
    const bytes = CryptoJS.AES.decrypt(b64Cipher, ACCESS_PASSWORD);
    const plain = bytes.toString(CryptoJS.enc.Utf8);
    if(!plain) return null;
    return JSON.parse(plain);
  }catch(e){ return null; }
}
// 加密：明文对象 -> base64密文（CryptoJS 默认输出即 "Salted__..." 格式）
function encryptData(obj){
  const txt = JSON.stringify(obj);
  const enc = CryptoJS.AES.encrypt(txt, ACCESS_PASSWORD);
  return enc.toString(); // base64
}

// ============================================================
//  全局状态
// ============================================================
let ganttData = null;
let selectedTaskId = null;
let editingTaskId = null;
const todayStr = getTodayStr();
const todayOrd = dateStrToOrd(todayStr);

// ============================================================
//  密码验证 UI
// ============================================================
function doUnlock(){
  const v = document.getElementById('pwdInput').value;
  const msg = document.getElementById('pwdMsg');
  if(!v){ msg.className='pwd-msg err'; msg.textContent='请输入密码'; return; }
  // 用一份内嵌的"探测密文"验证密码是否正确（避免先用网络文件失败导致误判）
  if(v !== ACCESS_PASSWORD){ msg.className='pwd-msg err'; msg.textContent='密码错误，请重试'; return; }
  msg.className='pwd-msg ok'; msg.textContent='验证成功，正在加载数据...';
  document.getElementById('pwdOverlay').style.display='none';
  document.getElementById('mainHeader').style.display='flex';
  document.getElementById('mainToolbar').style.display='flex';
  document.getElementById('mainContainer').style.display='flex';
  init();
}
function lockApp(){
  // 清除内存数据，回到密码页
  ganttData = null;
  document.getElementById('pwdInput').value='';
  document.getElementById('pwdMsg').textContent='';
  document.getElementById('pwdOverlay').style.display='flex';
  document.getElementById('mainHeader').style.display='none';

// ============================================================
//  初始化：加载并解密数据
// ============================================================
async function init(){
  const params = new URLSearchParams(location.search);
  const dataUrl = params.get('data') || ENC_FILENAME;
  try{
    const res = await fetch(dataUrl + '?t=' + Date.now(), { cache:'no-store' });
    if(!res.ok) throw new Error('无法加载数据文件');
    const encObj = await res.json();          // { "ciphertext": "<base64>" }
    const b64 = encObj.ciphertext;
    if(!b64) throw new Error('密文为空');
    const data = decryptData(b64);
    if(!data || !data.tasks) throw new Error('解密失败：密码错误或数据损坏');
    ganttData = data;
  }catch(e){
    console.warn('加载/解密失败，使用默认数据', e);
    ganttData = getDefaultData();
    showStatus('githubStatus','⚠️ 无法读取加密数据，已载入默认数据（修改后保存将写入 '+ENC_FILENAME+'）','info');
  }
  const saved = localStorage.getItem('github_config');
  if(saved){
    const cfg = JSON.parse(saved);
    document.getElementById('cfg_owner').value = cfg.owner||'';
    document.getElementById('cfg_repo').value = cfg.repo||'';
    document.getElementById('cfg_branch').value = cfg.branch||'main';
    document.getElementById('cfg_token').value = cfg.token||'';
    document.getElementById('cfg_path').value = cfg.path||ENC_FILENAME;
    showStatus('githubStatus','✅ GitHub 已配置，可以保存到仓库','success');
  }else{
    showStatus('githubStatus','⚠️ 未配置 GitHub，数据仅保存在本地。点击右上角「配置GitHub」开启协作功能。','info');
  }
  document.getElementById('f_start').value = todayStr;
  renderAll();
}

function renderProjectInfo(){const p=ganttData.project;document.getElementById('projectInfo').textContent=`${p.name} | 负责人：${p.manager} | ${p.startDate} ~ ${p.endDate}`;}

// ============================================================
//  甘特图核心渲染（按天/按周/按月）
// ============================================================
function renderGantt(){
  const area=document.getElementById('ganttArea');const s=document.getElementById('searchInput').value.toLowerCase();const ph=document.getElementById('phaseFilter').value;const view=document.getElementById('viewMode').value;
  let tasks=ganttData.tasks.filter(x=>(!s||x.name.toLowerCase().includes(s))&&(!ph||x.phase===ph));
  const phaseOrder=[];const phases={};tasks.forEach(x=>{if(!phases[x.phase]){phases[x.phase]=[];phaseOrder.push(x.phase);}phases[x.phase].push(x);});
  let rsOrd,reOrd;if(tasks.length>0){const ords=tasks.map(x=>dateStrToOrd(x.start));rsOrd=Math.min(...ords);reOrd=Math.max(...ords);tasks.forEach(x=>{const e=dateStrToOrd(x.start)+x.duration-1;if(e>reOrd)reOrd=e;});}else{rsOrd=dateStrToOrd(ganttData.project.startDate||'2026-01-01');reOrd=dateStrToOrd(ganttData.project.endDate||'2026-12-31');}
  const dayWidth=28;let html='';const colors=[...new Set(tasks.map(x=>x.color))];
  html+='<div class="legend"><span style="font-weight:600;margin-right:5px;">图例：</span>';
  const cmap={ '#4CAF50':'启动/完成','#2196F3':'设计','#FF9800':'开发','#9C27B0':'测试','#F44336':'上线','#00BCD4':'其他' };
  colors.forEach(c=>{html+=`<div class="legend-item"><div class="legend-color" style="background:${c}"></div>${cmap[c]||c}</div>`;});
  html+='<div class="legend-item" style="margin-left:auto;"><div class="legend-color" style="background:#f44336;width:2px;height:14px;"></div>今日</div></div>';
  if(view==='month') html+=renderMonthView(phaseOrder,phases,rsOrd,reOrd,dayWidth);
  else if(view==='week') html+=renderWeekView(phaseOrder,phases,rsOrd,reOrd,dayWidth);
  else html+=renderDayView(phaseOrder,phases,rsOrd,reOrd,dayWidth);
  area.innerHTML=html;
}
function renderDayView(po,ph,rs,re,dw){const vs=rs-2,ve=re+5,td=ve-vs+1,tw=td*dw;let h='';h+='<div class="gantt-header-row"><div class="gantt-task-label-header">任务</div><div class="gantt-timeline-header" style="width:'+tw+'px;">';for(let i=0;i<td;i++){const o=vs+i,ds=ordToDateStr(o),p=ds.split('-').map(Number),dow=getDayOfWeek(ds),we=dow===0||dow===6,tod=o===todayOrd,dn=['日','一','二','三','四','五','六'][dow];h+=`<div class="gantt-day-header${we?' weekend':''}${tod?' today':''}" style="width:${dw}px;"><div class="day-num">${p[2]}</div><div class="day-name">${dn}</div></div>`;}h+='</div></div>';h+='<div class="gantt-body" style="position:relative;">';const trp=todayOrd-vs;if(trp>=0&&trp<td)h+=`<div class="gantt-today-line" style="left:${150+trp*dw}px;"></div>`;for(let i=0;i<td;i++){const o=vs+i,l=150+i*dw,d=getDayOfWeek(ordToDateStr(o));if(d===0||d===6)h+=`<div style="position:absolute;top:0;bottom:0;left:${l}px;width:${dw*2}px;background:rgba(0,0,0,.02);pointer-events:none;"></div>`;h+=`<div class="gantt-grid-line" style="left:${l}px;"></div>`;}
  po.forEach(pn=>{h+=`<div class="phase-separator">📌 ${pn}</div>`;ph[pn].forEach(t=>{const od=dateStrToOrd(t.start),off=od-vs,l=off*dw,w=t.duration*dw-4,pw=Math.round(t.progress/100*w),e=addDaysToStr(t.start,t.duration-1),tt=`${t.name}|${t.progress}%|${t.start}~${e}`;h+=`<div class="gantt-row" ondblclick="openEdit(${t.id})" title="${tt}"><div class="gantt-task-label"><div class="label-name">${t.name}</div><div class="label-owner">${t.owner}|${t.duration}天|${t.progress}%</div></div><div class="gantt-bar-area" style="width:${tw}px;"><div class="gantt-bar-wrapper" style="left:${l}px;width:${w}px;" title="${tt}"><div class="gantt-bar-bg" style="background:${t.color};width:${w}px;"></div><div class="gantt-bar-progress" style="width:${pw}px;background:${t.color};opacity:.85;"></div><div class="gantt-bar-label">${t.name}</div></div></div></div>`;});});
  h+='</div>';return h;
}
function renderWeekView(po,ph,rs,re,dw){const vs=rs-2,ve=re+5,td=ve-vs+1,tw=td*dw;let h='';h+='<div class="gantt-header-row"><div class="gantt-task-label-header">任务</div><div class="gantt-timeline-header" style="width:'+tw+'px;">';let fw=vs;while(getDayOfWeek(ordToDateStr(fw))!==1)fw++;for(let o=fw;o<=ve;o+=7){const ws=ordToDateStr(o),we=ordToDateStr(o+6),p=ws.split('-').map(Number),e=we.split('-').map(Number),cur=o<=todayOrd&&todayOrd<=o+6;h+=`<div style="width:${dw*7}px;text-align:center;font-size:11px;font-weight:600;color:#555;padding:5px 0;${cur?'background:#e8f0fe;':''}">${p[1]}/${p[2]} ~ ${e[1]}/${e[2]}</div>`;}h+='</div></div>';h+='<div class="gantt-body" style="position:relative;">';const trp=todayOrd-vs;if(trp>=0&&trp<td)h+=`<div class="gantt-today-line" style="left:${150+trp*dw}px;"></div>`;for(let i=0;i<td;i++){const o=vs+i,l=150+i*dw,d=getDayOfWeek(ordToDateStr(o));if(d===0||d===6)h+=`<div style="position:absolute;top:0;bottom:0;left:${l}px;width:${dw*2}px;background:rgba(0,0,0,.02);pointer-events:none;"></div>`;h+=`<div class="gantt-grid-line" style="left:${l}px;"></div>`;}
  po.forEach(pn=>{h+=`<div class="phase-separator">📌 ${pn}</div>`;ph[pn].forEach(t=>{const od=dateStrToOrd(t.start),off=od-vs,l=off*dw,w=t.duration*dw-4,pw=Math.round(t.progress/100*w),e=addDaysToStr(t.start,t.duration-1),tt=`${t.name}|${t.progress}%|${t.start}~${e}`;h+=`<div class="gantt-row" ondblclick="openEdit(${t.id})" title="${tt}"><div class="gantt-task-label"><div class="label-name">${t.name}</div><div class="label-owner">${t.owner}|${t.duration}天|${t.progress}%</div></div><div class="gantt-bar-area" style="width:${tw}px;"><div class="gantt-bar-wrapper" style="left:${l}px;width:${w}px;" title="${tt}"><div class="gantt-bar-bg" style="background:${t.color};width:${w}px;"></div><div class="gantt-bar-progress" style="width:${pw}px;background:${t.color};opacity:.85;"></div><div class="gantt-bar-label">${t.name}</div></div></div></div>`;});});
  h+='</div>';return h;
}
function renderMonthView(po,ph,rs,re,dw){const ss=ordToDateStr(rs),ee=ordToDateStr(re),sy=ss.split('-').map(Number)[0],sm=ss.split('-').map(Number)[1],ey=ee.split('-').map(Number)[0],em=ee.split('-').map(Number)[1],mw=120,tm=(ey-sy)*12+(em-sm)+1,tw=tm*mw;let h='';h+='<div class="gantt-header-row"><div class="gantt-task-label-header">任务</div><div class="gantt-timeline-header" style="width:'+tw+'px;">';const ys={};for(let i=0;i<tm;i++){const yr=sy+Math.floor((sm-1+i)/12);ys[yr]=(ys[yr]||0)+1;}Object.keys(ys).sort().forEach(y=>{h+=`<div class="gantt-year-header" style="width:${ys[y]*mw}px;">${y}年</div>`;});h+='</div></div>';h+='<div class="gantt-header-row"><div class="gantt-task-label-header"></div><div class="gantt-timeline-header" style="width:'+tw+'px;">';for(let i=0;i<tm;i++){const mi=sm-1+i,yr=sy+Math.floor(mi/12),mo=(mi%12)+1,cur=yr===todayStr.split('-').map(Number)[0]&&mo===todayStr.split('-').map(Number)[1];h+=`<div class="gantt-month-header" style="width:${mw}px;${cur?'background:#1a73e8;color:#fff;':''}">${mo}月</div>`;}h+='</div></div>';h+='<div class="gantt-body" style="position:relative;">';const tp=todayStr.split('-').map(Number),tmi=(tp[0]-sy)*12+(tp[1]-sm),dit=getDaysInMonth(tp[0],tp[1]),timr=(tp[2]-1)/dit,tl=150+(tmi+timr)*mw;if(tmi>=0&&tmi<tm)h+=`<div class="gantt-today-line" style="left:${tl}px;"></div>`;for(let i=0;i<=tm;i++){h+=`<div class="gantt-grid-line" style="left:${150+i*mw}px;border-left:1px solid #e8e8e8;"></div>`;}
  po.forEach(pn=>{h+=`<div class="phase-separator">📌 ${pn}</div>`;ph[pn].forEach(t=>{const p=t.start.split('-').map(Number),mfs=(p[0]-sy)*12+(p[1]-sm),dit2=getDaysInMonth(p[0],p[1]),imr=(p[2]-1)/dit2,l=(mfs+imr)*mw,dm=t.duration/dit2,w=Math.max(mw*dm-2,8),pw=Math.round(t.progress/100*w),e=addDaysToStr(t.start,t.duration-1),tt=`${t.name}|${t.progress}%|${t.start}~${e}`;h+=`<div class="gantt-row" ondblclick="openEdit(${t.id})" title="${tt}"><div class="gantt-task-label"><div class="label-name">${t.name}</div><div class="label-owner">${t.owner}|${t.duration}天|${t.progress}%</div></div><div class="gantt-bar-area" style="width:${tw}px;"><div class="gantt-bar-wrapper" style="left:${l}px;width:${w}px;" title="${tt}"><div class="gantt-bar-bg" style="background:${t.color};width:${w}px;"></div><div class="gantt-bar-progress" style="width:${pw}px;background:${t.color};opacity:.85;"></div><div class="gantt-bar-label">${t.name}</div></div></div></div>`;});});
  h+='</div>';return h;
}

// ============================================================
//  任务操作
// ============================================================
function selectTask(id){selectedTaskId=id;renderTaskList();}
function addTask(){const nm=document.getElementById('f_name').value.trim(),sv=document.getElementById('f_start').value,du=parseInt(document.getElementById('f_duration').value)||1;if(!nm||!sv){alert('请填写任务名称和开始日期');return;}if(!isValidDateStr(sv)){alert('请选择有效的开始日期（YYYY-MM-DD）');return;}const so=dateStrToOrd(sv),rt=ordToDateStr(so);if(rt!==sv){alert(`日期解析异常：${sv}->${rt}`);return;}const nid=ganttData.tasks.length>0?Math.max(...ganttData.tasks.map(x=>x.id))+1:1;const nt={id:nid,phase:document.getElementById('f_phase').value||'未分类',name:nm,owner:document.getElementById('f_owner').value||'未分配',start:sv,duration:du,progress:parseInt(document.getElementById('f_progress').value)||0,color:document.getElementById('f_color').value||'#4CAF50'};const e=addDaysToStr(nt.start,nt.duration-1);ganttData.tasks.push(nt);document.getElementById('f_name').value='';document.getElementById('f_progress').value='0';document.getElementById('f_progress_val').textContent='0';document.getElementById('f_start').value=todayStr;document.getElementById('debugAdd').textContent=`✓ 已添加: ${nt.start} ~ ${e} (${nt.duration}天)`;renderAll();showStatus('githubStatus',`✅ 任务「${nm}」已添加（${nt.start} ~ ${e}）`,'success');setTimeout(()=>showStatus('githubStatus',''),4000);}
function deleteTask(id){if(!confirm('确定删除这个任务吗？'))return;ganttData.tasks=ganttData.tasks.filter(x=>x.id!==id);renderAll();}
function openEdit(id){const t=ganttData.tasks.find(x=>x.id===id);if(!t)return;editingTaskId=id;document.getElementById('e_name').value=t.name;document.getElementById('e_phase').value=t.phase;document.getElementById('e_owner').value=t.owner;document.getElementById('e_start').value=t.start;document.getElementById('e_duration').value=t.duration;document.getElementById('e_progress').value=t.progress;document.getElementById('e_progress_val').textContent=t.progress;document.getElementById('e_color').value=t.color;document.getElementById('editModal').classList.add('active');}
function closeModal(){document.getElementById('editModal').classList.remove('active');editingTaskId=null;}
function saveEdit(){const t=ganttData.tasks.find(x=>x.id===editingTaskId);if(!t)return;const ns=document.getElementById('e_start').value;if(!isValidDateStr(ns)){alert('日期格式无效');return;}t.name=document.getElementById('e_name').value;t.phase=document.getElementById('e_phase').value;t.owner=document.getElementById('e_owner').value;t.start=ns;t.duration=parseInt(document.getElementById('e_duration').value)||1;t.progress=parseInt(document.getElementById('e_progress').value)||0;t.color=document.getElementById('e_color').value;const e=addDaysToStr(t.start,t.duration-1);showStatus('githubStatus',`✅ 已更新：${t.start} ~ ${e}`,'success');setTimeout(()=>showStatus('githubStatus',''),3000);closeModal();renderAll();}

// ============================================================
//  GitHub 配置 & 保存（保存时 AES 加密后写入 .enc.json）
// ============================================================
function showConfig(){document.getElementById('configModal').classList.add('active');}
function closeConfig(){document.getElementById('configModal').classList.remove('active');}
function saveConfig(){const cfg={owner:document.getElementById('cfg_owner').value.trim(),repo:document.getElementById('cfg_repo').value.trim(),branch:document.getElementById('cfg_branch').value.trim()||'main',token:document.getElementById('cfg_token').value.trim(),path:document.getElementById('cfg_path').value.trim()||ENC_FILENAME};localStorage.setItem('github_config',JSON.stringify(cfg));closeConfig();showStatus('githubStatus','✅ GitHub 配置已保存','success');setTimeout(()=>renderAll(),1000);}

async function saveToGitHub(){
  const saved=localStorage.getItem('github_config');if(!saved){showStatus('githubStatus','⚠️ 请先配置 GitHub 信息','error');showConfig();return;}
  const cfg=JSON.parse(saved);if(!cfg.token||!cfg.owner||!cfg.repo){showStatus('githubStatus','⚠️ GitHub 配置不完整','error');return;}
  showStatus('githubStatus','⏳ 正在加密并保存到 GitHub...','info');
  try{
    const apiUrl=`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${cfg.path}`;
    const getRes=await fetch(apiUrl+'?ref='+cfg.branch,{headers:{'Authorization':'token '+cfg.token}});
    let sha=null;if(getRes.ok)sha=(await getRes.json()).sha;
    // 明文 ganttData -> AES 加密 -> base64 密文 -> 写入仓库
    const b64Cipher = encryptData(ganttData);
    const body = JSON.stringify({ ciphertext: b64Cipher });
    const encoded = btoa(unescape(encodeURIComponent(body))); // GitHub Contents API 要求 base64 编码的内容
    const putRes=await fetch(apiUrl,{method:'PUT',headers:{'Authorization':'token '+cfg.token,'Content-Type':'application/json'},body:JSON.stringify({message:'更新加密甘特图数据 - '+new Date().toLocaleString('zh-CN'),content:encoded,branch:cfg.branch,sha:sha})});
    if(!putRes.ok)throw new Error((await putRes.json()).message||'保存失败');
    showStatus('githubStatus','✅ 已加密并成功保存到 GitHub！','success');renderLastUpdated();
  }catch(e){showStatus('githubStatus','❌ 保存失败：'+e.message,'error');}
}

//  导入/导出（操作明文 ganttData；导出为明文 JSON 备份）

function exportJSON(){const d=JSON.stringify(ganttData,null,2),b=new Blob([d],{type:'application/json'}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download='gantt-data.json';a.click();URL.revokeObjectURL(u);}
function importJSON(){document.getElementById('fileInput').click();}
function handleImport(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=function(ev){try{ganttData=JSON.parse(ev.target.result);renderAll();showStatus('githubStatus','✅ 数据导入成功','success');setTimeout(()=>showStatus('githubStatus',''),3000);}catch(err){showStatus('githubStatus','❌ 文件格式错误','error');}r.readAsText(f);e.target.value='';}

// ============================================================
//  工具函数
// ============================================================
function showStatus(id,msg,type){const el=document.getElementById(id);if(!msg){el.innerHTML='';return;}el.innerHTML=`<div class="status-msg ${type}">${msg}</div>`;}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeConfig();}if((e.ctrlKey||e.metaKey)&&e.key==='s'){e.preventDefault();saveToGitHub();}});
